# Tags API Contract

**Version**: 1.0.0
**Date**: 2026-02-23
**Feature**: 005-advanced-features-kafka-dapr

---

## Overview

This document defines the Tags API for managing user-defined tags used for task categorization. All endpoints require JWT authentication.

---

## Base URL

```
/api/tags
```

---

## Authentication

All endpoints require JWT token in Authorization header:

```
Authorization: Bearer <jwt_token>
```

---

## Endpoints

### List Tags

**GET** `/api/tags`

List all tags for the authenticated user.

**Query Parameters**:
- `page` (integer, optional): Page number (default: 1)
- `limit` (integer, optional): Items per page (default: 50, max: 100)

**Response** (200 OK):
```json
{
  "tags": [
    {
      "id": 1,
      "user_id": 1,
      "name": "work",
      "color": "#3B82F6",
      "created_at": "2026-02-20T10:00:00Z",
      "task_count": 5
    },
    {
      "id": 5,
      "user_id": 1,
      "name": "urgent",
      "color": "#EF4444",
      "created_at": "2026-02-21T14:30:00Z",
      "task_count": 3
    }
  ],
  "pagination": {
    "page": 1,
    "limit": 50,
    "total": 2,
    "total_pages": 1
  }
}
```

---

### Get Tag

**GET** `/api/tags/{tag_id}`

Retrieve a specific tag with details.

**Response** (200 OK):
```json
{
  "id": 1,
  "user_id": 1,
  "name": "work",
  "color": "#3B82F6",
  "created_at": "2026-02-20T10:00:00Z",
  "task_count": 5
}
```

**Error Responses**:
- 404 Not Found: Tag not found or doesn't belong to user
- 401 Unauthorized: Missing or invalid JWT

---

### Create Tag

**POST** `/api/tags`

Create a new tag for the authenticated user.

**Request Body**:
```json
{
  "name": "personal",
  "color": "#10B981"
}
```

**Response** (201 Created):
```json
{
  "id": 8,
  "user_id": 1,
  "name": "personal",
  "color": "#10B981",
  "created_at": "2026-02-23T10:00:00Z"
}
```

**Error Responses**:
- 400 Bad Request: Tag name already exists for user
- 401 Unauthorized: Missing or invalid JWT
- 422 Validation Error: Invalid name or color format

---

### Update Tag

**PUT** `/api/tags/{tag_id}`

Full update of a tag. Both name and color can be modified.

**Request Body**:
```json
{
  "name": "work-urgent",
  "color": "#DC2626"
}
```

**Response** (200 OK):
```json
{
  "id": 1,
  "user_id": 1,
  "name": "work-urgent",
  "color": "#DC2626",
  "created_at": "2026-02-20T10:00:00Z",
  "updated_at": "2026-02-23T14:30:00Z"
}
```

**Error Responses**:
- 400 Bad Request: New name already exists for user
- 404 Not Found: Tag not found
- 401 Unauthorized: Missing or invalid JWT

---

### Partial Update Tag

**PATCH** `/api/tags/{tag_id}`

Partial update - only provided fields are modified.

**Request Body** (example - update only color):
```json
{
  "color": "#F59E0B"
}
```

**Response** (200 OK):
```json
{
  "id": 1,
  "user_id": 1,
  "name": "work",
  "color": "#F59E0B",
  "created_at": "2026-02-20T10:00:00Z",
  "updated_at": "2026-02-23T15:00:00Z"
}
```

---

### Delete Tag

**DELETE** `/api/tags/{tag_id}`

Delete a tag. This does not delete associated tasks, only removes the tag association.

**Response** (204 No Content):
No response body.

**Error Responses**:
- 404 Not Found: Tag not found
- 401 Unauthorized: Missing or invalid JWT

**Side Effects**:
- All task-tag associations for this tag are removed
- Tasks previously tagged with this tag remain intact

---

## Validation Rules

### Name
- Required
- 1-50 characters
- Allowed characters: alphanumeric, spaces, hyphens
- Must be unique per user (case-insensitive)
- Cannot be empty or whitespace only

### Color
- Required
- Must be valid 6-digit hex color code
- Format: #RRGGBB (e.g., #3B82F6)
- Case-insensitive (#3B82F6 = #3b82f6)

