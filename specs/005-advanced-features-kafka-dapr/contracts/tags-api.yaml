---

## Error Response Format

```json
{
  "detail": "Tag name 'work' already exists",
  "errors": [
    {
      "field": "name",
      "message": "Tag name must be unique per user"
    }
  ]
}
```

**Common Error Codes**:
- 400 Bad Request: Duplicate tag name
- 401 Unauthorized: Missing or invalid JWT
- 403 Forbidden: Tag belongs to another user
- 404 Not Found: Tag not found
- 422 Validation Error: Schema validation failed

---

## Examples

### Create Tag with Default Color

```bash
curl -X POST http://localhost:8000/api/tags \
  -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." \
  -H "Content-Type: application/json" \
  -d '{
    "name": "meetings"
  }'
```

### Update Tag Color

```bash
curl -X PUT http://localhost:8000/api/tags/1 \
  -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." \
  -H "Content-Type: application/json" \
  -d '{
    "name": "work",
    "color": "#DC2626"
  }'
```

### Filter Tasks by Tag

```bash
curl -X GET "http://localhost:8000/api/tasks?tags=1" \
  -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
```

