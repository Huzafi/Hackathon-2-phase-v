# Extended Tasks API Contract

**Version**: 1.0.0
**Date**: 2026-02-23
**Feature**: 005-advanced-features-kafka-dapr

---

## Overview

This document defines the extended Tasks API with support for due dates, priorities, tags, search, filter, and sort functionality. All endpoints require JWT authentication.

---

## Base URL

```
/api/tasks
```

---

## Authentication

All endpoints require JWT token in Authorization header:

```
Authorization: Bearer <jwt_token>
```

---

## Endpoints

### Create Task (Extended)

**POST** `/api/tasks`

Create a new task with optional due date, priority, and tags.

**Request Body**:
```json
{
  "title": "Complete quarterly report",
  "description": "Finish Q1 financial report",
  "due_date": "2026-02-28T23:59:59Z",
  "priority": "high",
  "tag_ids": [1, 5]
}
```

**Response** (201 Created):
```json
{
  "id": 123,
  "user_id": 1,
  "title": "Complete quarterly report",
  "description": "Finish Q1 financial report",
  "completed": false,
  "due_date": "2026-02-28T23:59:59Z",
  "priority": "high",
  "tags": [
    {"id": 1, "name": "work", "color": "#3B82F6"},
    {"id": 5, "name": "urgent", "color": "#EF4444"}
  ],
  "created_at": "2026-02-23T10:00:00Z",
  "updated_at": "2026-02-23T10:00:00Z"
}
```

**Error Responses**:
- 400 Bad Request: Invalid priority, due_date in past, title too long
- 401 Unauthorized: Missing or invalid JWT
- 422 Validation Error: Missing required fields

---

### Get Task (Extended)

**GET** `/api/tasks/{task_id}`

Retrieve a specific task with full details including tags and reminders.

**Response** (200 OK):
```json
{
  "id": 123,
  "user_id": 1,
  "title": "Complete quarterly report",
  "description": "Finish Q1 financial report",
  "completed": false,
  "due_date": "2026-02-28T23:59:59Z",
  "priority": "high",
  "tags": [
    {"id": 1, "name": "work", "color": "#3B82F6"}
  ],
  "reminders": [
    {
      "id": 1,
      "trigger_time": "2026-02-28T09:00:00Z",
      "delivered": false
    }
  ],
  "recurrence_rule": null,
  "created_at": "2026-02-23T10:00:00Z",
  "updated_at": "2026-02-23T10:00:00Z"
}
```

**Error Responses**:
- 404 Not Found: Task not found or doesn't belong to user
- 401 Unauthorized: Missing or invalid JWT

---

### Update Task (Extended)

**PUT** `/api/tasks/{task_id}`

Full update of a task. All fields can be modified.

**Request Body**:
```json
{
  "title": "Complete quarterly report",
  "description": "Finish Q1 financial report and send to manager",
  "due_date": "2026-02-27T23:59:59Z",
  "priority": "high",
  "tag_ids": [1, 5, 8]
}
```

**Response** (200 OK):
```json
{
  "id": 123,
  "user_id": 1,
  "title": "Complete quarterly report",
  "description": "Finish Q1 financial report and send to manager",
  "completed": false,
  "due_date": "2026-02-27T23:59:59Z",
  "priority": "high",
  "tags": [
    {"id": 1, "name": "work", "color": "#3B82F6"},
    {"id": 5, "name": "urgent", "color": "#EF4444"},
    {"id": 8, "name": "finance", "color": "#10B981"}
  ],
  "created_at": "2026-02-23T10:00:00Z",
  "updated_at": "2026-02-23T14:30:00Z"
}
```

