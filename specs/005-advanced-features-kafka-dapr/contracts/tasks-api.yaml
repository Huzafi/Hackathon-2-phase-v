### Partial Update Task (Extended)

**PATCH** `/api/tasks/{task_id}`

Partial update - only provided fields are modified.

**Request Body** (example - update only priority):
```json
{
  "priority": "medium"
}
```

**Request Body** (example - update only tags):
```json
{
  "tag_ids": [1, 8]
}
```

**Response** (200 OK):
```json
{
  "id": 123,
  "user_id": 1,
  "title": "Complete quarterly report",
  "description": "Finish Q1 financial report and send to manager",
  "completed": false,
  "due_date": "2026-02-27T23:59:59Z",
  "priority": "medium",
  "tags": [
    {"id": 1, "name": "work", "color": "#3B82F6"},
    {"id": 8, "name": "finance", "color": "#10B981"}
  ],
  "created_at": "2026-02-23T10:00:00Z",
  "updated_at": "2026-02-23T15:00:00Z"
}
```

---

### Delete Task

**DELETE** `/api/tasks/{task_id}`

Delete a task. If task has recurring instances, behavior depends on query parameter.

**Query Parameters**:
- `delete_future` (boolean, optional): If true and task is recurring, delete all future instances. Default: false.

**Response** (204 No Content):
No response body.

**Error Responses**:
- 404 Not Found: Task not found
- 401 Unauthorized: Missing or invalid JWT

---

### List Tasks with Filters and Sort

**GET** `/api/tasks`

List all tasks for authenticated user with optional search, filters, and sorting.

**Query Parameters**:

| Parameter | Type | Description | Example |
|-----------|------|-------------|---------|
| q | string | Search keyword (title and description) | `?q=report` |
| priority | enum | Filter by priority (high, medium, low) | `?priority=high` |
| status | enum | Filter by status (completed, incomplete, overdue) | `?status=overdue` |
| tags | array | Filter by tag IDs (comma-separated) | `?tags=1,5,8` |
| due_date_from | datetime | Filter tasks due on or after this date | `?due_date_from=2026-02-01` |
| due_date_to | datetime | Filter tasks due on or before this date | `?due_date_to=2026-02-28` |
| sort_by | enum | Sort field (due_date, priority, created_at, title) | `?sort_by=due_date` |
| sort_order | enum | Sort order (asc, desc) | `?sort_order=asc` |
| page | integer | Page number (default: 1) | `?page=2` |
| limit | integer | Items per page (default: 50, max: 100) | `?limit=20` |

**Response** (200 OK):
```json
{
  "tasks": [
    {
      "id": 123,
      "title": "Complete quarterly report",
      "description": "Finish Q1 financial report",
      "completed": false,
      "due_date": "2026-02-28T23:59:59Z",
      "priority": "high",
      "tags": [{"id": 1, "name": "work", "color": "#3B82F6"}],
      "created_at": "2026-02-23T10:00:00Z",
      "updated_at": "2026-02-23T10:00:00Z"
    }
  ],
  "pagination": {
    "page": 1,
    "limit": 50,
    "total": 127,
    "total_pages": 3
  }
}
```

**Priority Sort Order**:
- `sort_order=asc`: low → medium → high
- `sort_order=desc`: high → medium → low

---

## Search and Filter Behavior

### Search (q parameter)

- Case-insensitive search in title and description
- Supports partial matches (e.g., `?q=rep` matches "report")
- Uses PostgreSQL full-text search with ranking
- Results ordered by relevance when search is active

### Filter Combinations

Multiple filters use AND logic:
```
GET /api/tasks?priority=high&status=overdue&tags=1,5
```
Returns: High priority AND overdue AND has tag 1 OR 5

### Status Filter Values

- `completed`: Tasks with completed=true
- `incomplete`: Tasks with completed=false
- `overdue`: Tasks with completed=false AND due_date < now()

---

## Validation Rules

### Title
- Required
- 1-200 characters
- Cannot be empty or whitespace only

### Description
- Optional
- 0-1000 characters

### Due Date
- Optional
- Must be valid ISO 8601 datetime
- Cannot be in the past (returns 400 error)
- Time component defaults to 23:59:59 if only date provided

### Priority
- Required for creation (default: medium if not provided)
- Must be one of: high, medium, low

### Tags
- Optional
- Tag IDs must exist and belong to user
- Maximum 10 tags per task

---

## Error Response Format

```json
{
  "detail": "Error message",
  "errors": [
    {
      "field": "due_date",
      "message": "Due date cannot be in the past"
    }
  ]
}
```

**Common Error Codes**:
- 400 Bad Request: Validation error (past due date, invalid priority)
- 401 Unauthorized: Missing or invalid JWT
- 403 Forbidden: Task belongs to another user
- 404 Not Found: Task or tag not found
- 422 Validation Error: Schema validation failed

---

## Rate Limiting

- 100 requests per minute per user
- 1000 requests per hour per user

**Rate Limit Headers**:
```
X-RateLimit-Limit: 100
X-RateLimit-Remaining: 95
X-RateLimit-Reset: 1645632000
```

**Response** (429 Too Many Requests):
```json
{
  "detail": "Rate limit exceeded. Try again in 60 seconds."
}
```

