## Examples

### Create High Priority Task with Due Date and Tags

```bash
curl -X POST http://localhost:8000/api/tasks \
  -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." \
  -H "Content-Type: application/json" \
  -d '{
    "title": "Submit tax return",
    "description": "File 2025 tax return",
    "due_date": "2026-04-15T23:59:59Z",
    "priority": "high",
    "tag_ids": [1, 5]
  }'
```

### Search for Overdue High Priority Tasks

```bash
curl -X GET "http://localhost:8000/api/tasks?priority=high&status=overdue&sort_by=due_date&sort_order=asc" \
  -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
```

### Filter Tasks by Tags

```bash
curl -X GET "http://localhost:8000/api/tasks?tags=1,5,8&sort_by=created_at&sort_order=desc" \
  -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
```

