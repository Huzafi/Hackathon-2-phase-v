apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: kafka:29092
  - name: authType
    value: "none"
  - name: consumerGroup
    value: dapr-consumer-group
  - name: initialOffset
    value: "newest"
  - name: maxMessageBytes
    value: "1048576"
